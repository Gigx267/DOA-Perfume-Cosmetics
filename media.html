<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOA Group | Luxury Fragrance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-main: #ffffff;
            --accent-pink: #ffd1dc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Replace with a surreal landscape image */
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), 
                        url('https://i.pinimg.com/736x/20/ce/f1/20cef1fbdf1c5fbd5844c67630453e2d.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;   
            padding: 20px;
            overflow-x: hidden;
        }

        /* The surreal glowing orbs from the image */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            opacity: 0.6;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--accent-pink); bottom: -50px; right: -50px; }
        .orb-2 { width: 150px; height: 150px; background: #fff; bottom: 100px; left: 10%; filter: blur(40px); }

        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            /* The pill-shaped frosted glass container */
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 100px; /* High radius for that "capsule" look */
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            animation: fadeIn 1.2s ease-out;
        }

        .profile-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
            /* Clipping path to mimic the circular cutout in the reference image */
            mask-image: radial-gradient(circle, black 100%, transparent 100%);
        }

        .label-destination {
            text-transform: lowercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-card {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.8); /* Dark button like the Apple Pay button */
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .social-card:hover {
            transform: scale(1.03);
            background: rgba(0, 0, 0, 0.9);
        }

        .social-card i {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        /* Footer text styling like "Pay, cry and fly" */
        .footer-tagline {
            margin-top: 25px;
            font-size: 0.75rem;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Small Audio Toggle */
        #music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
            backdrop-filter: blur(10px);
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <button id="music-toggle" onclick="toggleMusic()">Music</button>
    <audio id="bgMusic" loop src="mp.mp3"></audio>

    <div class="content-wrapper">
        <div class="profile-header">
            <img src="logo.png" alt="DOA" class="profile-logo" onerror="this.src='https://via.placeholder.com/150'">
            <p class="label-destination">collection</p>
        
        </div>
       
        <p class="subtitle">Luxury Fragrance Collection</p>

        <div class="links-wrapper">
            <a href="https://doaperfumescosmetics.com/" class="social-card card-shop">
            <i class="fas fa-shopping-bag"></i> Shop Collection
            </a>
            <a href="https://www.instagram.com/doagroup.ng" class="social-card card-instagram">
            <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://wa.me/2348038810268" class="social-card card-whatsapp">
            <i class="fab fa-whatsapp"></i> WhatsApp Concierge
            </a>
            <a href="https://www.tiktok.com/@doagroup.ng" class="social-card card-tiktok">
            <i class="fab fa-tiktok"></i> TikTok
            </a>
        </div>

        <p class="footer-tagline">Smell, feel and glow.</p>
    </div>

    <script>
        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('music-toggle');
            if (music.paused) {
                music.play();
                btn.innerText = "AMBIENCE: ON";
            } else {
                music.pause();
                btn.innerText = "AMBIENCE: OFF";
            }
        }
    </script>
</body>
</html>
